name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - name: Analyse statique
        run: flutter analyze
      - name: Tests (contraste, rendu, performance, synchro, parcours)
        run: flutter test
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

  supabase-schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Schéma, RLS, partage et fusion
        run: npm test
